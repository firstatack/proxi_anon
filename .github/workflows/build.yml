name: build-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go (para compilar tun2socks)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Instalar NDK (para armeabi-v7a y x86_64)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.2.12479018" >/dev/null

      - name: Compilar libtun2socks.so (jniLibs, 3 ABIs)
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v2.7.0 https://github.com/xjasonlyu/tun2socks.git /tmp/tun2socks
          cp "$GITHUB_WORKSPACE/native/libtun2socks/main.go" /tmp/tun2socks/main.go
          cd /tmp/tun2socks
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          CC_PATH="$SDK/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GO_FLAGS="-buildmode=c-shared -trimpath -ldflags=-s -w"

          # arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC_PATH/aarch64-linux-android21-clang" \
            go build $GO_FLAGS -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libtun2socks.so" .

          # armeabi-v7a
          GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=1 CC="$CC_PATH/armv7a-linux-androideabi21-clang" \
            go build $GO_FLAGS -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libtun2socks.so" .

          # x86_64
          GOOS=android GOARCH=amd64 CGO_ENABLED=1 CC="$CC_PATH/x86_64-linux-android21-clang" \
            go build $GO_FLAGS -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libtun2socks.so" .

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxiAnon-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
