name: release-apk

# Crear un tag vX.Y.Z publica el APK firmado como GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build + Release APK firmado
    runs-on: ubuntu-latest

    env:
      PROXIANON_KEYSTORE_B64: ${{ secrets.PROXIANON_KEYSTORE_B64 }}
      PROXIANON_KEYSTORE_PASSWORD: ${{ secrets.PROXIANON_KEYSTORE_PASSWORD }}
      PROXIANON_KEY_ALIAS: ${{ secrets.PROXIANON_KEY_ALIAS }}
      PROXIANON_KEY_PASSWORD: ${{ secrets.PROXIANON_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Instalar NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.2.12479018" >/dev/null

      - name: Compilar libtun2socks.so (jniLibs, 3 ABIs)
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v2.7.0 https://github.com/xjasonlyu/tun2socks.git /tmp/tun2socks
          cp "$GITHUB_WORKSPACE/native/libtun2socks/main.go" /tmp/tun2socks/main.go
          cd /tmp/tun2socks
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          CC_PATH="$SDK/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"

          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC_PATH/aarch64-linux-android21-clang" \
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libtun2socks.so" .

          GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=1 CC="$CC_PATH/armv7a-linux-androideabi21-clang" \
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libtun2socks.so" .

          GOOS=android GOARCH=amd64 CGO_ENABLED=1 CC="$CC_PATH/x86_64-linux-android21-clang" \
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libtun2socks.so" .

      - name: Firmar APK release
        run: |
          echo "$PROXIANON_KEYSTORE_B64" | base64 -d > "$HOME/proxianon-release.jks"
          PROXIANON_KEYSTORE_FILE="$HOME/proxianon-release.jks" ./gradlew assembleRelease --stacktrace

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true